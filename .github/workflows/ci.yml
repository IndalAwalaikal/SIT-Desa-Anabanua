name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: desa_digital_test
          MYSQL_USER: desa_app
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod download
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot 2>/dev/null && break
            echo "waiting for MySQL..."; sleep 2
          done
      - name: Set test env
        run: |
          echo "JWT_ACCESS_SECRET=ci-test-secret-of-at-least-thirty-two-bytes-1234567890" >> $GITHUB_ENV
          echo "DOCUMENT_HMAC_SECRET=ci-test-hmac-secret-of-at-least-thirty-two-bytes-12" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_USER=desa_app" >> $GITHUB_ENV
          echo "DB_PASSWORD=password" >> $GITHUB_ENV
          echo "DB_NAME=desa_digital_test" >> $GITHUB_ENV
          echo "APP_ENV=development" >> $GITHUB_ENV
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: desa-anabanua:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
